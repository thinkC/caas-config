---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-caas-mgmt-config
  namespace: capi-self
data:
  values.yaml: |
    # Must match the name of the (sealed) secret in credentials.yaml
    cloudCredentialsSecretName: cluster-caas-mgmt-credentials

    kubernetesVersion: 1.34.1
    machineImageId: "e3b3c216-9cac-4fee-8a1e-aa95d942f643"

    clusterNetworking:
      externalNetworkId: "57add367-d205-4030-a929-d75617a7c63e"

    controlPlane:
      machineFlavor: "vm.v1.small"
      machineCount: 1

    nodeGroups:
      - name: workers
        machineFlavor: "vm.v1.large"
        machineCount: 2
    machineSSHKeyName: bo307-mywsl1

    addons:
      # Use the cilium CNI
      cni:
        type: cilium

      # Enable the monitoring stack
      monitoring:
        enabled: true

      # Disable NFD and the NVIDIA/Mellanox operators
      nodeFeatureDiscovery:
        enabled: false
      nvidiaGPUOperator:
        enabled: false
      mellanoxNetworkOperator:
        enabled: false

      ingress:
        enabled: true
        nginx:
          release:
            values:
              controller:
                service:
                  loadBalancerIP: "128.232.226.144"
                allowSnippetAnnotations: true
